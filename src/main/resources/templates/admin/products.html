<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Products</title>
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css" />
</head>
<body>
<header>
    <h1>Products</h1>
    <a th:href="@{/admin}">Back</a> | <a th:href="@{/admin/products/new}">New Product</a>
</header>
<main>
    <table>
        <thead>
        <tr><th>ID</th><th>Name</th><th>Price</th><th>Stock</th><th>Actions</th></tr>
        </thead>
        <tbody>
        <tr th:each="p : ${products}">
            <td th:text="${p.id}">1</td>
            <td th:text="${p.name}">Name</td>
            <td th:text="${p.price}">0.00</td>
            <td th:text="${p.stock}">0</td>
            <td><a th:href="@{'/admin/products/edit/' + ${p.id}}">Edit</a></td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
