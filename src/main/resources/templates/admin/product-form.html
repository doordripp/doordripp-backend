<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product Form</title>
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css" />
</head>
<body>
<header>
    <h1 th:text="${product.id} == null ? 'New Product' : 'Edit Product'">Product</h1>
    <a th:href="@{/admin/products}">Back</a>
</header>
<main>
    <form th:action="@{/admin/products/save}" th:object="${product}" method="post">
        <input type="hidden" th:field="*{id}" />
        <label>Name <input th:field="*{name}" /></label>
        <label>Description <textarea th:field="*{description}"></textarea></label>
        <label>Price <input th:field="*{price}"/></label>
        <label>Stock <input th:field="*{stock}"/></label>
        <button type="submit">Save</button>
    </form>
</main>
</body>
</html>
