<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Orders</title>
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css" />
</head>
<body>
<header>
    <h1>Orders</h1>
    <a th:href="@{/admin}">Back</a>
</header>
<main>
    <table>
        <thead>
        <tr><th>ID</th><th>Customer</th><th>Total</th><th>Created</th></tr>
        </thead>
        <tbody>
        <tr th:each="o : ${orders}">
            <td th:text="${o.id}">1</td>
            <td th:text="${o.customer.name}">Customer</td>
            <td th:text="${o.total}">0.00</td>
            <td th:text="${o.createdAt}">date</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
