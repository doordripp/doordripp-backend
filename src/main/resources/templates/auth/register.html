<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css" />
</head>
<body>
<main>
    <h1>Register</h1>
    <div th:if="${error}" th:text="${error}" style="color:red"></div>
    <form th:action="@{/register}" th:object="${customer}" method="post">
        <label>Name <input th:field="*{name}"/></label>
        <label>Email <input th:field="*{email}"/></label>
        <label>Password <input type="password" th:field="*{password}"/></label>
        <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a th:href="@{/login}">Login</a></p>
</main>
</body>
</html>
